<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08282d"/>
      <stop offset="100%" stop-color="#0e5e57"/>
    </linearGradient>
    <linearGradient id="roadGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ffa3"/>
      <stop offset="50%" stop-color="#39e0c8"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="roadSurf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c4046"/>
      <stop offset="100%" stop-color="#08292d"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="overpassShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-4" dy="6" stdDeviation="6" flood-color="#041214" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#bg)"/>

  <!-- Subtle Inner Border -->
  <rect x="17" y="17" width="478" height="478" rx="127" fill="none" stroke="#39e0c8" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Outer Cyan Neon Aura -->
  <path d="M 95, 185 C 145, 185 160, 220 180, 290 C 196, 345 220, 355 236, 320 C 248, 290 252, 235 256, 200 C 260, 235 264, 290 276, 320 C 292, 355 316, 345 332, 290 C 352, 220 367, 185 417, 185" fill="none" stroke="url(#roadGlow)" stroke-width="62" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" opacity="0.45"/>

  <!-- Solid White Road Casing / Edges -->
  <path d="M 95, 185 C 145, 185 160, 220 180, 290 C 196, 345 220, 355 236, 320 C 248, 290 252, 235 256, 200 C 260, 235 264, 290 276, 320 C 292, 355 316, 345 332, 290 C 352, 220 367, 185 417, 185" fill="none" stroke="#ffffff" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dark Asphalt Road Surface -->
  <path d="M 95, 185 C 145, 185 160, 220 180, 290 C 196, 345 220, 355 236, 320 C 248, 290 252, 235 256, 200 C 260, 235 264, 290 276, 320 C 292, 355 316, 345 332, 290 C 352, 220 367, 185 417, 185" fill="none" stroke="url(#roadSurf)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Glowing Cyan Dashed Centerline -->
  <path d="M 95, 185 C 145, 185 160, 220 180, 290 C 196, 345 220, 355 236, 320 C 248, 290 252, 235 256, 200 C 260, 235 264, 290 276, 320 C 292, 355 316, 345 332, 290 C 352, 220 367, 185 417, 185" fill="none" stroke="#39e0c8" stroke-width="7" stroke-dasharray="16 14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3D Overpass Accent on Center-Right Curve -->
  <g filter="url(#overpassShadow)">
    <path d="M 256, 200 C 260, 235 264, 290 276, 320 C 292, 355 316, 345 332, 290" fill="none" stroke="#ffffff" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 256, 200 C 260, 235 264, 290 276, 320 C 292, 355 316, 345 332, 290" fill="none" stroke="url(#roadSurf)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 256, 200 C 260, 235 264, 290 276, 320 C 292, 355 316, 345 332, 290" fill="none" stroke="#39e0c8" stroke-width="7" stroke-dasharray="16 14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
