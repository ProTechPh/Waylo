<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080" role="img" aria-label="A night map with a route drawn across it">
<title>Waylo night map</title>
<style>
  :root { --bg:#071317; --blk:#0f2429; --rd:#1b343b; --maj:#26474f; --art:#2f5a64; --water:#0c2c3a; --park:#0d2a24; --route:#34e5c6; }
  .rd { fill:none; stroke:var(--rd); stroke-width:1.7; }
  .rd.maj { stroke:var(--maj); stroke-width:4.4; }
  .art { fill:none; stroke:var(--art); stroke-width:9; stroke-linecap:round; }
  .blk rect { fill:var(--blk); }
  .rt { fill:none; stroke:var(--route); stroke-linecap:round; stroke-linejoin:round; }
  .rt.dash { stroke-dasharray:2 34; animation:appear .5s 2.5s both, flow 3.4s linear 2.5s infinite; }
  @keyframes flow { to { stroke-dashoffset:-72; } }
  @keyframes appear { from { opacity:0; } }
  /* The route draws itself once, then the dashes run along it. The static state is the drawn one,
     so a browser that never runs SVG animation still shows the whole route. */
  .draw { stroke-dasharray:100; stroke-dashoffset:0; animation:draw 2.1s cubic-bezier(.45,0,.2,1) .45s both; }
  @keyframes draw { from { stroke-dashoffset:100; } }
  @media (prefers-reduced-motion: reduce) {
    .draw, .rt.dash { animation:none; }
  }
</style>
